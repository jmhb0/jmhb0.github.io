name: James Burgess
intro_paragraphs:
  - "I work on AI in industry. This site mostly reflects my earlier academic work, from my PhD in machine learning at Stanford, where I was fortunate to be advised by <a href=\"https://ai.stanford.edu/~syyeung/\">Serena Yeung-Levy</a> and supported by the <a href=\"https://www.quadfellowship.org/\">Quad Fellowship</a>."
  - "During my PhD, I built and evaluated LLMs and VLMs: benchmarks, RL training, agentic systems, and synthetic data. My work covered both general ML methodology and applications to biology and medicine."
